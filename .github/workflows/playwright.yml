name: Playwright Daily Pipeline

on:
  schedule:
    # 8:00 AM IST is 2:30 AM UTC
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-playwright-pipeline
  cancel-in-progress: false

jobs:
  test:
    name: Run Automation Suite & Send Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Create .env file
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          WEBSITE_USERNAME: ${{ secrets.WEBSITE_USERNAME }}
          WEBSITE_PASSWORD: ${{ secrets.WEBSITE_PASSWORD }}
          LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          TESTMAIL_API_KEY: ${{ secrets.TESTMAIL_API_KEY }}
          TESTMAIL_NAMESPACE: ${{ secrets.TESTMAIL_NAMESPACE }}
        run: |
          required=(BASE_URL WEBSITE_USERNAME WEBSITE_PASSWORD LOGIN_EMAIL SMTP_HOST SMTP_PORT SMTP_USER SMTP_PASS EMAIL_RECIPIENTS TESTMAIL_API_KEY TESTMAIL_NAMESPACE)
          for name in "${required[@]}"; do
            if [ -z "${!name}" ]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          {
            printf 'BASE_URL=%s\n' "$BASE_URL"
            printf 'WEBSITE_USERNAME=%s\n' "$WEBSITE_USERNAME"
            printf 'WEBSITE_PASSWORD=%s\n' "$WEBSITE_PASSWORD"
            printf 'LOGIN_EMAIL=%s\n' "$LOGIN_EMAIL"
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "$SMTP_PORT"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'SMTP_PASS=%s\n' "$SMTP_PASS"
            printf 'EMAIL_RECIPIENTS=%s\n' "$EMAIL_RECIPIENTS"
            printf 'TESTMAIL_API_KEY=%s\n' "$TESTMAIL_API_KEY"
            printf 'TESTMAIL_NAMESPACE=%s\n' "$TESTMAIL_NAMESPACE"
          } > .env

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Combined Test Pipeline
        run: npm run pipeline
        env:
          CI: 'true'
          TEST_ENV: UAT

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            reports/
            test-results/
          retention-days: 14
