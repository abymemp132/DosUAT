name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '30 2 * * *' # Runs every day at 02:30 UTC (08:00 AM IST)
    - cron: '10 8 16 7 *' # Runs at 08:10 UTC (01:40 PM IST) on July 16th
  workflow_dispatch:

jobs:
  run-pipeline:
    timeout-minutes: 60
    runs-on: self-hosted
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Create .env file
      env:
        ENV_FILE_CONTENT: ${{ secrets.ENV_FILE }}
      run: |
        [System.IO.File]::WriteAllText(".env", $env:ENV_FILE_CONTENT)
        
    - name: Install dependencies
      run: npm ci

    - name: Run TypeScript check
      run: npm run typecheck

    - name: Run lint
      run: npm run lint
      
    - name: Install Playwright Browsers
      run: npx playwright install chromium
      
    - name: Run Combined Pipeline (Tests, Dashboard, PDF, Email)
      run: npm run pipeline
      
    - name: Upload Test Report Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-pipeline-reports
        path: |
          playwright-report/
          reports/dashboard-static/
          reports/results.json
        retention-days: 5
