name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: windows-latest
    
    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      WEBSITE_USERNAME: ${{ secrets.WEBSITE_USERNAME }}
      WEBSITE_PASSWORD: ${{ secrets.WEBSITE_PASSWORD }}
      LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
      MAILSLURP_API_KEY: ${{ secrets.MAILSLURP_API_KEY }}
      MAILSLURP_INBOX_ID: ${{ secrets.MAILSLURP_INBOX_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
      
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run Playwright tests
      run: npm run test:raw
      
    - name: Generate Dashboard and PDF Report
      if: always()
      run: |
        npm run dashboard:static
        npm run report:pdf
        
    - name: Upload Test Report Artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-reports
        path: |
          playwright-report/
          reports/dashboard-static/
          reports/results.json
        retention-days: 14
