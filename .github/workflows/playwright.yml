name: Playwright Daily Pipeline

on:
  schedule:
    # 8:00 AM IST is 2:30 AM UTC
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Run Automation Suite & Send Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          BASE_URL=${{ secrets.BASE_URL || 'https://dos-web-uat.abym.us/' }}
          WEBSITE_USERNAME=${{ secrets.WEBSITE_USERNAME || 'Abym' }}
          WEBSITE_PASSWORD=${{ secrets.WEBSITE_PASSWORD || 'Abym@1234' }}
          LOGIN_EMAIL=${{ secrets.LOGIN_EMAIL || 'twkxl.test@inbox.testmail.app' }}
          
          # Netlify Configuration
          NETLIFY_AUTH_TOKEN=${{ secrets.NETLIFY_AUTH_TOKEN || 'nfp_E9Vo9GUKHnXdsPjTvbm6nW26AqqfooS4b228' }}
          NETLIFY_SITE_ID=${{ secrets.NETLIFY_SITE_ID || 'fccaf16e-f4ad-4640-8f24-b49a3c78adc7' }}
          
          # Email Configuration
          SMTP_HOST=${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT=${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER=${{ secrets.SMTP_USER || 'abymemp132@gmail.com' }}
          SMTP_PASS=${{ secrets.SMTP_PASS || 'hwzz dbvd oipu noxe' }}
          EMAIL_RECIPIENTS=${{ secrets.EMAIL_RECIPIENTS || 'abymemp132@gmail.com' }}
          
          # Testmail.app Configuration
          TESTMAIL_API_KEY=${{ secrets.TESTMAIL_API_KEY || '3ccd5b9e-de12-4c6f-ab3e-e30cbf58dcf6' }}
          TESTMAIL_NAMESPACE=${{ secrets.TESTMAIL_NAMESPACE || 'twkxl' }}
          EOF

      - name: Run TypeScript Check
        run: npm run typecheck

      - name: Run ESLint
        run: npm run lint

      - name: Run Combined Test Pipeline
        run: npm run pipeline
        env:
          CI: 'true'

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-artifacts
          path: |
            playwright-report/
            reports/
            test-results/
          retention-days: 14
